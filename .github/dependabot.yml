# Weekly and grouped, so updates arrive as a handful of pull requests instead of dozens, and each
# one goes through CI.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node's types follow the Node runtime (22), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Remotion packages must stay on the same exact version.
      remotion:
        patterns: ["remotion", "@remotion/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "@next/*"]
      # The type-based groups below would otherwise also take Remotion packages and split one
      # Remotion release across pull requests that each fail on mixed versions (#173).
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["remotion", "@remotion/*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ["remotion", "@remotion/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
