# Every change to main goes through this. Strict: frozen lockfile, Biome in CI mode (no writes),
# strict TypeScript in every workspace, all tests, and a production build of the web app.
# Efficient: dependency and Next.js caches, the build only runs once the cheap checks pass, and a
# newer push to the same pull request cancels the older run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # The contribution workflow (CONTRIBUTING.md, ADR-0014): branch names, PR title and closing
  # keyword, Conventional Commits, and main taking only pull request merges. The same rules run
  # in the local git hooks. Needs no install: scripts/policy uses only Bun and git.
  policy:
    name: Policy
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit in the pull request, and main's history for the push check.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pull request (branch, title, closing keyword, every commit)
        if: github.event_name == 'pull_request'
        run: bun scripts/policy/cli.ts pr

      - name: Main takes only pull request merges
        if: github.event_name == 'push'
        run: bun scripts/policy/cli.ts main-push

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (lockfile must be up to date)
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome, no writes)
        run: bunx biome ci .

      - name: Typecheck every workspace
        run: bun run typecheck

      - name: Unit tests
        run: bun test

  # Production runs on Node, the unit tests on Bun: the token crypto must hold on both.
  node-crypto:
    name: Token crypto on Node
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Forged tokens fail to decrypt
        run: node scripts/check-crypto-node.mjs

  build:
    name: Build web
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install (lockfile must be up to date)
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build
        env:
          # Canonical URLs, robots.txt and the sitemap are prerendered with this origin.
          APP_URL: https://wrapyourgit.com
