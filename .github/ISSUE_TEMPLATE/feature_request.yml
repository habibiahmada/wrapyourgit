name: Feature request
description: A new metric, scene, export or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where would the data come from?
      description: Every number must have a source. Name the GitHub API field or explain how it would be computed. Leave empty if it is not about data.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
